services:
  postgres:
    image: postgres:17-alpine
    container_name: talentscout-db
    environment:
      POSTGRES_USER: talentscout
      POSTGRES_PASSWORD: talentscout
      POSTGRES_DB: talentscout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentscout -d talentscout"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
